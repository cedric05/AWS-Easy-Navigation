name: Release

# Build and publish the packaged extension whenever a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package ZIP
        run: |
          cd dist
          zip -r -FS "../aws-easy-navigation.zip" . -x '*.DS_Store'

      # Signed .crx is produced only when a signing key is configured as the
      # CRX_PRIVATE_KEY repository secret. Chrome is preinstalled on the runner.
      - name: Package CRX
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "CRX_PRIVATE_KEY secret not set — skipping signed .crx (ZIP is still produced)."
            exit 0
          fi
          printf '%s' "$CRX_PRIVATE_KEY" > key.pem
          google-chrome --no-sandbox \
            --pack-extension="$PWD/dist" \
            --pack-extension-key="$PWD/key.pem"
          mv dist.crx aws-easy-navigation.crx
          rm -f key.pem

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aws-easy-navigation-${{ github.ref_name }}
          path: |
            aws-easy-navigation.zip
            aws-easy-navigation.crx
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aws-easy-navigation.zip
            aws-easy-navigation.crx
          generate_release_notes: true
          fail_on_unmatched_files: false
